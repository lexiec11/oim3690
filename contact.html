<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Lexie</title>
  <meta name="description" content="Contact page for Lexie's OIM3690 website" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4ef;
      color: #222;
      line-height: 1.5;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    nav {
      margin-top: 12px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    h1, h2 {
      margin-top: 0;
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      background: #111;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background: #333;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>Contact Me</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="contact.html">Contact</a>
      <a href="playground.html">Playground</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>Get in Touch</h2>
      <p>This is my contact page for OIM3690.</p>

      <form action="https://formspree.io/f/xgvakzdo" method="POST">
        <div>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your name" required />
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="Your email" required />
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
        </div>

        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Made by Lexie</p>
  </footer>
</body>
</html>
